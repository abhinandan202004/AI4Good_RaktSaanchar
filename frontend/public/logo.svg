<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Gradients -->
  <defs>
    <linearGradient id="dropGradient" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="50%" stop-color="#E51B23" />
      <stop offset="100%" stop-color="#9C0A0F" />
    </linearGradient>
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Droplet Path -->
  <path d="M50 8 C50 8 18 46 18 70 A 32 32 0 0 0 82 70 C 82 46 50 8 50 8 Z" fill="url(#dropGradient)" />

  <!-- Pulse/EKG Line through the Droplet -->
  <path d="M25 70 L39 70 L44 58 L50 80 L56 64 L61 70 L75 70" stroke="url(#pulseGradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
