databases:
  - name: raktsaanchar-db
    databaseName: raktsaanchar
    plan: free

services:
  # ── Redis ──────────────────────────────────────────────────────────────────
  - type: redis
    name: raktsaanchar-redis
    plan: free
    ipAllowList: []   # only internal access

  # ── Nginx API Gateway ─────────────────────────────────────────────────────
  - type: web
    name: raktsaanchar-gateway
    runtime: docker
    dockerfilePath: ./infra/Dockerfile
    dockerContext: ./infra
    plan: free
    ports:
      - port: 80
    envVars:
      - key: PORT
        value: 80

  # ── Auth Service ──────────────────────────────────────────────────────────
  - type: web
    name: raktsaanchar-auth-service
    runtime: docker
    dockerfilePath: ./services/auth-service/Dockerfile
    dockerContext: ./services/auth-service
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: raktsaanchar-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: raktsaanchar-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

  # ── Core Service ──────────────────────────────────────────────────────────
  - type: web
    name: raktsaanchar-core-service
    runtime: docker
    dockerfilePath: ./services/core-service/Dockerfile
    dockerContext: ./services/core-service
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: raktsaanchar-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: raktsaanchar-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ML_SERVICE_URL
        value: http://raktsaanchar-ml-service:8005

  # ── Notification Service ──────────────────────────────────────────────────
  - type: web
    name: raktsaanchar-notification-service
    runtime: docker
    dockerfilePath: ./services/notification-service/Dockerfile
    dockerContext: ./services/notification-service
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: raktsaanchar-db
          property: connectionString
      - key: CORE_DB_URL
        fromDatabase:
          name: raktsaanchar-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Set manually on Render: SMTP_USER, SMTP_PASS, NTFY_BASE_URL, NTFY_TOPIC_PREFIX

  # ── Chat Service ──────────────────────────────────────────────────────────
  - type: web
    name: raktsaanchar-chat-service
    runtime: docker
    dockerfilePath: ./services/chat-service/Dockerfile
    dockerContext: ./services/chat-service
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: raktsaanchar-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: raktsaanchar-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256

  # ── ML Service ────────────────────────────────────────────────────────────
  - type: web
    name: raktsaanchar-ml-service
    runtime: docker
    dockerfilePath: ./services/ml-service/Dockerfile
    dockerContext: ./services/ml-service
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: raktsaanchar-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256

  # ── Chatbot Service ───────────────────────────────────────────────────────
  - type: web
    name: raktsaanchar-chatbot-service
    runtime: docker
    dockerfilePath: ./services/chatbot-service/Dockerfile
    dockerContext: ./services/chatbot-service
    plan: free
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: raktsaanchar-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: CORE_SERVICE_URL
        value: http://raktsaanchar-core-service:8002
      # Set manually on Render: MISTRAL_API_KEY, SARVAM_API_KEY

  # ── Frontend (React Static Site) ───────────────────────────────────────────
  - type: web
    name: raktsaanchar-frontend
    runtime: static
    buildCommand: cd frontend && npm install --legacy-peer-deps && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://raktsaanchar-gateway.onrender.com/api/v1
      - key: VITE_WS_URL
        value: wss://raktsaanchar-gateway.onrender.com/api/v1/chat/ws
