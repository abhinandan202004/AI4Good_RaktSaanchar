server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576  # 1MB
    backoff_config:
      min_period: 500ms
      max_period: 5s
      max_retries: 10

scrape_configs:
  # ── 1. Scrape Docker Containers via Docker daemon socket ──────────────────
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container_name'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'app'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'

    pipeline_stages:
      # Parse Docker container JSON log wrapper
      - docker: {}

      # Parse FastAPI JSON structured logging payload
      - json:
          expressions:
            level: level
            logger: logger
            service: service
            trace_id: trace_id
            span_id: span_id
            http_method: http_method
            http_path: http_path
            http_status: http_status
            duration_ms: duration_ms

      # Promote selected fields to searchable Loki labels
      - labels:
          level:
          service:
          http_method:
          http_status:

      # Extract log timestamp
      - timestamp:
          source: asctime
          format: RFC3339

  # ── 2. Fallback Direct Scrape (container log files) ────────────────────────
  - job_name: container-logs-direct
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          app: fastapi
          __path__: /var/log/containers/*fastapi*/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            trace_id: trace_id
            span_id: span_id
            http_method: http_method
            http_path: http_path
            http_status: http_status
      - labels:
          level:
          http_method:
          http_status:
