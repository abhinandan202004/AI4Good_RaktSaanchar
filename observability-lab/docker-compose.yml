version: "3.8"

networks:
  observability-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  loki_data:

services:
  # ── 1. FastAPI Application ──────────────────────────────────────────────────
  fastapi:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: observability-fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OTEL_SERVICE_NAME=fastapi-service
      - OTEL_SERVICE_VERSION=1.0.0
      - DEPLOYMENT_ENVIRONMENT=local-lab
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - ENABLE_METRICS=true
    labels:
      logging: "promtail"
    networks:
      - observability-net
    depends_on:
      jaeger:
        condition: service_started
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── 2. Prometheus (Metrics Scraper & Storage) ────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: observability-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - observability-net
    depends_on:
      - fastapi

  # ── 3. Loki (Centralized Log Aggregation) ───────────────────────────────────
  loki:
    image: grafana/loki:2.9.4
    container_name: observability-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - observability-net

  # ── 4. Promtail (Log Collector & Shipper) ───────────────────────────────────
  promtail:
    image: grafana/promtail:2.9.4
    container_name: observability-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - observability-net
    depends_on:
      - loki

  # ── 5. Jaeger (Distributed Tracing All-In-One with OTLP) ───────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: observability-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "14268:14268" # Jaeger collector HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - observability-net

  # ── 6. Grafana (Unified Visualization Dashboard) ───────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: observability-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - observability-net
    depends_on:
      - prometheus
      - loki
      - jaeger
