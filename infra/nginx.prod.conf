# =============================================================================
# RaktSaanchar — Nginx Gateway (PRODUCTION)
# =============================================================================
# Identical to nginx.conf but adds the frontend upstream so the SPA is
# served at / — keeping the dev config unchanged.
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # ── Docker DNS resolver (re-resolves container IPs dynamically) ───────────
    # This prevents 502 errors after container restarts/redeployments by
    # ensuring Nginx re-resolves upstream hostnames via Docker's internal DNS
    # instead of caching the IPs from startup time.
    # NOTE: resolver must be in http context; set variables must be in server.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── Timeouts & buffer sizes ───────────────────────────────────────────────
    proxy_connect_timeout       60s;
    proxy_send_timeout          60s;
    proxy_read_timeout          60s;
    client_max_body_size        20m;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/letsencrypt/live/raktsaanchar.servehttp.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/raktsaanchar.servehttp.com/privkey.pem;

        # TLS configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # ── Upstream variables ────────────────────────────────────────────────
        # set inside server block (valid Nginx context). Using variables forces
        # Nginx to use the resolver above and re-resolve container hostnames on
        # every request instead of caching IPs at startup.
        # IMPORTANT: proxy_pass with a variable passes $request_uri as-is,
        # so we must NOT repeat the path prefix in the proxy_pass URI.
        set $auth_upstream     http://auth-service:8001;
        set $core_upstream     http://core-service:8002;
        set $notif_upstream    http://notification-service:8003;
        set $chat_upstream     http://chat-service:8004;
        set $ml_upstream       http://ml-service:8005;
        set $chatbot_upstream  http://chatbot-service:8006;
        set $frontend_upstream http://frontend:80;

        # ── Auth & Users ──────────────────────────────────────────────────────
        location /api/v1/auth/ {
            proxy_pass         $auth_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/users/ {
            proxy_pass         $auth_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Core (donors / patients / requests / blood-bank / coordinator) ────
        location /api/v1/donors/ {
            proxy_pass         $core_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/patients/ {
            proxy_pass         $core_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/requests/ {
            proxy_pass         $core_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/blood-bank/ {
            proxy_pass         $core_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/coordinator/ {
            proxy_pass         $core_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/leaderboard/ {
            proxy_pass         $core_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Notifications ─────────────────────────────────────────────────────
        location /api/v1/notifications/ {
            proxy_pass         $notif_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Chat WebSocket (MUST come before /api/v1/chat/ REST block) ────────
        location /api/v1/chat/ws {
            proxy_pass             $chat_upstream;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade     $http_upgrade;
            proxy_set_header       Connection  "upgrade";
            proxy_set_header       Host        $host;
            proxy_read_timeout     3600s;
            proxy_send_timeout     3600s;
        }

        # ── Chat REST ─────────────────────────────────────────────────────────
        location /api/v1/chat/ {
            proxy_pass         $chat_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── ML & Transfusion ──────────────────────────────────────────────────
        location /api/v1/ml/ {
            proxy_pass         $ml_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/transfusion/ {
            proxy_pass         $ml_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/iron-overload/ {
            proxy_pass         $ml_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Chatbot ───────────────────────────────────────────────────────────
        location /api/v1/chatbot/ {
            proxy_pass         $chatbot_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Health check ──────────────────────────────────────────────────────
        location /health {
            return 200 '{"status":"gateway ok"}';
            add_header Content-Type application/json;
        }

        # ── Frontend SPA (catch-all — must be last) ───────────────────────────
        location / {
            proxy_pass         $frontend_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }
}
