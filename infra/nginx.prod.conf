# =============================================================================
# RaktSaanchar — Nginx Gateway (PRODUCTION)
# =============================================================================
# Identical to nginx.conf but adds the frontend upstream so the SPA is
# served at / — keeping the dev config unchanged.
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # ── Docker DNS resolver (re-resolves container IPs dynamically) ───────────
    # This prevents 502 errors after container restarts/redeployments by
    # ensuring Nginx re-resolves upstream hostnames via Docker's internal DNS
    # instead of caching the IPs from startup time.
    # NOTE: resolver must be in http context; set variables must be in server.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── Timeouts & buffer sizes ───────────────────────────────────────────────
    proxy_connect_timeout       60s;
    proxy_send_timeout          60s;
    proxy_read_timeout          60s;
    client_max_body_size        20m;

    server {
        listen 80;
        server_name _;

        # ── Upstream variables (set inside server — valid Nginx context) ──────
        # Using variables forces Nginx to use the resolver above and re-resolve
        # container hostnames on every request instead of caching IPs at startup.
        set $auth_upstream     auth-service:8001;
        set $core_upstream     core-service:8002;
        set $notif_upstream    notification-service:8003;
        set $chat_upstream     chat-service:8004;
        set $ml_upstream       ml-service:8005;
        set $chatbot_upstream  chatbot-service:8006;
        set $frontend_upstream frontend:80;

        # ── Auth & Users ──────────────────────────────────────────────────────
        location /api/v1/auth/ {
            proxy_pass         http://$auth_upstream/api/v1/auth/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/users/ {
            proxy_pass         http://$auth_upstream/api/v1/users/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Core (donors / patients / requests / blood-bank / coordinator) ────
        location /api/v1/donors/ {
            proxy_pass         http://$core_upstream/api/v1/donors/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/patients/ {
            proxy_pass         http://$core_upstream/api/v1/patients/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/requests/ {
            proxy_pass         http://$core_upstream/api/v1/requests/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/blood-bank/ {
            proxy_pass         http://$core_upstream/api/v1/blood-bank/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/coordinator/ {
            proxy_pass         http://$core_upstream/api/v1/coordinator/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/leaderboard/ {
            proxy_pass         http://$core_upstream/api/v1/leaderboard/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Notifications ─────────────────────────────────────────────────────
        location /api/v1/notifications/ {
            proxy_pass         http://$notif_upstream/api/v1/notifications/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Chat WebSocket (MUST come before /api/v1/chat/ REST block) ────────
        location /api/v1/chat/ws {
            proxy_pass             http://$chat_upstream/api/v1/chat/ws;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade     $http_upgrade;
            proxy_set_header       Connection  "upgrade";
            proxy_set_header       Host        $host;
            proxy_read_timeout     3600s;
            proxy_send_timeout     3600s;
        }

        # ── Chat REST ─────────────────────────────────────────────────────────
        location /api/v1/chat/ {
            proxy_pass         http://$chat_upstream/api/v1/chat/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── ML & Transfusion ──────────────────────────────────────────────────
        location /api/v1/ml/ {
            proxy_pass         http://$ml_upstream/api/v1/ml/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/transfusion/ {
            proxy_pass         http://$ml_upstream/api/v1/transfusion/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/iron-overload/ {
            proxy_pass         http://$ml_upstream/api/v1/iron-overload/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Chatbot ───────────────────────────────────────────────────────────
        location /api/v1/chatbot/ {
            proxy_pass         http://$chatbot_upstream/api/v1/chatbot/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Health check ──────────────────────────────────────────────────────
        location /health {
            return 200 '{"status":"gateway ok"}';
            add_header Content-Type application/json;
        }

        # ── Frontend SPA (catch-all — must be last) ───────────────────────────
        location / {
            proxy_pass         http://$frontend_upstream/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }
}
