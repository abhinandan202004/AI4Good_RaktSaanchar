# =============================================================================
# RaktSaanchar — Nginx Gateway (PRODUCTION)
# =============================================================================
# Identical to nginx.conf but adds the frontend upstream so the SPA is
# served at / — keeping the dev config unchanged.
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # ── Upstreams (internal Docker network hostnames) ─────────────────────────
    upstream auth     { server auth-service:8001; }
    upstream core     { server core-service:8002; }
    upstream notif    { server notification-service:8003; }
    upstream chat     { server chat-service:8004; }
    upstream ml       { server ml-service:8005; }
    upstream chatbot  { server chatbot-service:8006; }
    upstream frontend { server frontend:80; }

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── Timeouts & buffer sizes ───────────────────────────────────────────────
    proxy_connect_timeout       60s;
    proxy_send_timeout          60s;
    proxy_read_timeout          60s;
    client_max_body_size        20m;

    server {
        listen 80;
        server_name _;

        # ── Auth & Users ──────────────────────────────────────────────────────
        location /api/v1/auth/ {
            proxy_pass         http://auth/api/v1/auth/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/users/ {
            proxy_pass         http://auth/api/v1/users/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Core (donors / patients / requests / blood-bank / coordinator) ────
        location /api/v1/donors/ {
            proxy_pass         http://core/api/v1/donors/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/patients/ {
            proxy_pass         http://core/api/v1/patients/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/requests/ {
            proxy_pass         http://core/api/v1/requests/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/blood-bank/ {
            proxy_pass         http://core/api/v1/blood-bank/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/coordinator/ {
            proxy_pass         http://core/api/v1/coordinator/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/leaderboard/ {
            proxy_pass         http://core/api/v1/leaderboard/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Notifications ─────────────────────────────────────────────────────
        location /api/v1/notifications/ {
            proxy_pass         http://notif/api/v1/notifications/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Chat WebSocket (MUST come before /api/v1/chat/ REST block) ────────
        location /api/v1/chat/ws {
            proxy_pass             http://chat/api/v1/chat/ws;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade     $http_upgrade;
            proxy_set_header       Connection  "upgrade";
            proxy_set_header       Host        $host;
            proxy_read_timeout     3600s;
            proxy_send_timeout     3600s;
        }

        # ── Chat REST ─────────────────────────────────────────────────────────
        location /api/v1/chat/ {
            proxy_pass         http://chat/api/v1/chat/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── ML & Transfusion ──────────────────────────────────────────────────
        location /api/v1/ml/ {
            proxy_pass         http://ml/api/v1/ml/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/transfusion/ {
            proxy_pass         http://ml/api/v1/transfusion/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/iron-overload/ {
            proxy_pass         http://ml/api/v1/iron-overload/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Chatbot ───────────────────────────────────────────────────────────
        location /api/v1/chatbot/ {
            proxy_pass         http://chatbot/api/v1/chatbot/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Health check ──────────────────────────────────────────────────────
        location /health {
            return 200 '{"status":"gateway ok"}';
            add_header Content-Type application/json;
        }

        # ── Frontend SPA (catch-all — must be last) ───────────────────────────
        location / {
            proxy_pass         http://frontend/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }
}
