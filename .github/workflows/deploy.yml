name: Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual triggers via GitHub Actions UI

jobs:
  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
          NTFY_TOPIC_PREFIX: ${{ secrets.NTFY_TOPIC_PREFIX }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASS: ${{ secrets.RABBITMQ_PASS }}
          ML_SERVICE_URL: ${{ secrets.ML_SERVICE_URL }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          envs: SECRET_KEY,SMTP_USER,SMTP_PASS,NTFY_BASE_URL,NTFY_TOPIC_PREFIX,MISTRAL_API_KEY,SARVAM_API_KEY,SERVER_IP,RABBITMQ_USER,RABBITMQ_PASS,ML_SERVICE_URL,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e

            # Ensure repository exists on the VM (avoid early cd failure)
            if [ ! -d ~/AI4Good_RaktSaanchar ]; then
              echo "Repository not found. Cloning it..."
              git clone https://github.com/abhinandan202004/AI4Good_RaktSaanchar.git ~/AI4Good_RaktSaanchar
            fi
            cd ~/AI4Good_RaktSaanchar

            # Hard reset local repo to discard any local modifications
            echo "Fetching latest changes..."
            git fetch origin main
            git reset --hard origin/main

            # Dynamically recreate .env from environment secrets
            echo "Creating production .env file..."
            cat << EOF > .env
            SECRET_KEY="${SECRET_KEY}"
            SMTP_HOST="smtp.gmail.com"
            SMTP_PORT=587
            SMTP_USER="${SMTP_USER}"
            SMTP_PASS="${SMTP_PASS}"
            NTFY_BASE_URL="${NTFY_BASE_URL:-https://ntfy.sh}"
            NTFY_TOPIC_PREFIX="${NTFY_TOPIC_PREFIX:-raktsaanchar-prod}"
            MISTRAL_API_KEY="${MISTRAL_API_KEY}"
            SARVAM_API_KEY="${SARVAM_API_KEY}"
            RABBITMQ_USER="${RABBITMQ_USER:-rakt}"
            RABBITMQ_PASS="${RABBITMQ_PASS:-rakt}"
            SERVER_IP="${SERVER_IP}"
            ML_SERVICE_URL="${ML_SERVICE_URL:-https://abhinandan202004-raktsaanchar-ml.hf.space}"
            EOF

            # Ensure models directory exists
            mkdir -p models

            # Make docker compose less likely to timeout
            export COMPOSE_HTTP_TIMEOUT=300

            # Optional: login to Docker Hub to avoid anonymous rate limits
            if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
              echo "Logging in to Docker Hub..."
              echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin || true
            fi

            # Retry helper for pulling
            retry() {
              local n=0
              local max=5
              local wait=10
              until "$@"; do
                n=$((n+1))
                if [ "$n" -ge "$max" ]; then
                  echo "Command failed after $n attempts: $*"
                  return 1
                fi
                echo "Retry $n/$max after failure: $*"
                sleep "$wait"
              done
              return 0
            }

            # Pre-pull base images used by Dockerfiles (reduces build-time network requests and transient TLS failures)
            echo "Pre-pulling base images with retries..."
            retry docker pull python:3.12-slim || {
              echo "Warning: pre-pull of python:3.12-slim failed; continuing to build (may fail)."
            }
            retry docker pull node:20-alpine || true
            retry docker pull nginx:alpine || true

            # Pull other images referenced by compose if any (safe to ignore failures)
            echo "Pulling other docker compose images..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull || true

            # Build and deploy using Docker Compose (build will use the pre-pulled base if available)
            echo "Rebuilding and starting Docker containers..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

            # Clean up dangling images to keep storage footprint minimal (very important on 1GB RAM and standard SSD storage)
            echo "Pruning unused Docker images..."
            docker image prune -f

            # CRITICAL: Restart the Nginx gateway so it re-discovers the new
            # internal IPs of any recreated containers. Without this, the gateway
            # caches old IPs from startup and returns 502 until manually restarted.
            echo "Restarting gateway to re-resolve service IPs post-deploy..."
            sleep 10
            docker compose -f docker-compose.yml -f docker-compose.prod.yml restart gateway

            echo "Deployment completed successfully! Running gateway healthcheck..."
            sleep 5
            curl -f -k https://localhost/health || {
              echo "Warning: Healthcheck failed! Checking Docker service statuses."
              docker compose ps
              exit 1
            }
